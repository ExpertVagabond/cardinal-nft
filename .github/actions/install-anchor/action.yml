name: Setup Anchor cli

inputs:
  anchor_git:
    description: Link to Anchor cli GH repository
    required: true
  anchor_version:
    description: Version of Anchor cli
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/cache@v4
      name: Cache Cargo registry + index
      id: cache-anchor
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: cargo-${{ runner.os }}-anchor-${{ hashFiles('**/Cargo.lock') }}
    - name: Install anchor
      # anchor-cli 0.26.0's Cargo.lock pins a wasm-bindgen that rustc >= 1.82
      # refuses to compile, so build the CLI with a toolchain from its era.
      # Only this install uses it; clippy/fmt and anchor build keep RUST_TOOLCHAIN.
      if: steps.cache-anchor.outputs.cache-hit != 'true'
      run: |
        rustup toolchain install 1.75.0 --profile minimal
        cargo +1.75.0 install --git ${{inputs.anchor_git}} --tag v${{inputs.anchor_version}} anchor-cli --locked --force
      shell: bash
    - uses: actions/upload-artifact@v4
      with:
        name: anchor-binary
        path: ~/.cargo/bin/anchor
