name: Install Solana

inputs:
  solana_version:
    description: Version of Solana to install
    required: true

runs:
  using: "composite"
  steps:
    - name: Cache Solana Install
      id: cache-solana-install
      uses: actions/cache@v4
      with:
        path: "$HOME/.local/share/solana/install/releases/${{ inputs.solana_version }}"
        key: ${{ runner.os }}-Solana-v${{ inputs.solana_version  }}

    - name: Install Solana
      # release.solana.com no longer serves the pre-Anza installers reliably
      # (SSL_ERROR_SYSCALL from GitHub runners), so fetch the release tarball
      # straight from GitHub Releases and lay it out where the installer would.
      if: steps.cache-solana-install.outputs.cache-hit != 'true'
      run: |
        RELEASE_DIR="$HOME/.local/share/solana/install/releases/${{ inputs.solana_version }}"
        mkdir -p "$RELEASE_DIR"
        curl -sSfL --retry 3 \
          "https://github.com/solana-labs/solana/releases/download/v${{ inputs.solana_version }}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" \
          -o /tmp/solana-release.tar.bz2
        tar -xjf /tmp/solana-release.tar.bz2 -C "$RELEASE_DIR"
        test -x "$RELEASE_DIR/solana-release/bin/solana"
      shell: bash

    - name: Set Active Solana Version
      run: |
        rm -f "$HOME/.local/share/solana/install/active_release"
        ln -s "$HOME/.local/share/solana/install/releases/${{ inputs.solana_version }}/solana-release" "$HOME/.local/share/solana/install/active_release"
      shell: bash

    - name: Add Solana bin to Path
      run: |
        echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
      shell: bash

    - name: Verify Solana install
      run: |
        solana --version
      shell: bash

    - name: Install toolchain
      run: |
        echo Installing bpf toolchain...
        (cd /home/runner/.local/share/solana/install/active_release/bin/sdk/bpf/scripts; ./install.sh)
      shell: bash
